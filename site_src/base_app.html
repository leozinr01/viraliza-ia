<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>{% block titulo %}Painel · Viraliza{% endblock %}</title>
<link rel="icon" href="/assets/icone.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css?v={{ v }}">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script src="/assets/config.js?v={{ v }}"></script>
<script src="/assets/viraliza.js?v={{ v }}"></script>
</head>
<body>
<div class="shell">
<aside class="side">
  <a class="logo" href="/app"><img src="/assets/icone.svg" alt="" width="28" height="28"><span>viraliza</span></a>
  <nav class="nav">
    <span class="nav-h">Estúdio</span>
    <a href="/app" class="{% block nav_painel %}on{% endblock %}"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Visão geral</a>
    <a href="/app/cortes" class="{% block nav_cortes %}{% endblock %}"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="11" rx="1.5"/><rect x="14" y="3" width="7" height="11" rx="1.5"/><path d="M3 18h18M3 21h11"/></svg>Meus cortes</a>
    <a href="/app/conexoes" class="{% block nav_conexoes %}{% endblock %}"><svg viewBox="0 0 24 24"><path d="M9 15 15 9M10.5 6.5l1.8-1.8a4.2 4.2 0 0 1 6 6l-1.8 1.8M13.5 17.5l-1.8 1.8a4.2 4.2 0 0 1-6-6l1.8-1.8"/></svg>Conexões</a>
    <span class="nav-h">Suporte</span>
    <a href="/contato"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>Fale com a gente</a>
  </nav>
  <div class="side-foot">
    <div class="wk" id="wk" title="O notebook é quem processa os vídeos"><i></i><div><b>Notebook</b><span>verificando...</span></div></div>
    <div class="me"><span class="av" id="av"></span><div class="me-t"><b id="quem"></b><span id="mail"></span></div>
      <button class="icon-btn" onclick="VZ.sair()" title="Sair" aria-label="Sair"><svg viewBox="0 0 24 24"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l-5-5 5-5M5 12h11"/></svg></button></div>
  </div>
</aside>
<div class="main">
{% block conteudo %}{% endblock %}
</div>
</div>
<script>
const ICON_DL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 20h14"/></svg>';
const $ = s => document.querySelector(s), esc = VZ.esc, toast = VZ.toast;
// links de VOD aceitos (a mesma regra existe no banco: lives_fonte_check)
const PLATS = { twitch: 'Twitch', youtube: 'YouTube', kick: 'Kick' };
const plataforma = u => /^https:\/\/(www\.|m\.)?twitch\.tv\/videos\/\d+/i.test(u) ? 'twitch'
  : /^https:\/\/((www\.|m\.)?youtube\.com\/(watch\?(.*&)?v=|live\/)|youtu\.be\/)[\w-]{11}/i.test(u) ? 'youtube'
  : /^https:\/\/(www\.)?kick\.com\/([\w-]+\/videos|video)\/[\w-]+/i.test(u) ? 'kick' : null;
const platTag = u => { const p = plataforma(u); return p ? `<span class="plat ${p}">${PLATS[p]}</span>` : ''; };
const hms = s => { s = Math.floor(s || 0); return Math.floor(s / 3600) + ':' + String(Math.floor(s % 3600 / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
async function statusWorker() {
  const { data } = await VZ.sb.from('worker').select('visto_em').eq('id', 1).maybeSingle();
  const on = data && data.visto_em && (Date.now() - new Date(data.visto_em)) < 90000;
  $('#wk').classList.toggle('on', !!on);
  $('#wk span').textContent = on ? 'Online, pronto pra processar' : 'Offline';
  return on;
}
const PRONTO = VZ.exigirLogin().then(s => {
  const m = s.user.user_metadata || {}, n = String(m.nome || m.full_name || m.name || s.user.email);
  $('#quem').textContent = n.split(' ').slice(0, 2).join(' ');
  $('#mail').textContent = s.user.email || '';
  $('#av').textContent = n.trim().charAt(0).toUpperCase();
  statusWorker(); setInterval(statusWorker, 15000);
  return s;
});
</script>
{% block scripts %}{% endblock %}
</body>
</html>
