<script>
const ICON_DL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 20h14"/></svg>';
const $ = s => document.querySelector(s), esc = VZ.esc, toast = VZ.toast;
// links de VOD aceitos (a mesma regra existe no banco: lives_fonte_check)
const PLATS = { twitch: 'Twitch', youtube: 'YouTube', kick: 'Kick' };
const plataforma = u => /^https:\/\/(www\.|m\.)?twitch\.tv\/videos\/\d+/i.test(u) ? 'twitch'
  : /^https:\/\/((www\.|m\.)?youtube\.com\/(watch\?(.*&)?v=|live\/)|youtu\.be\/)[\w-]{11}/i.test(u) ? 'youtube'
  : /^https:\/\/(www\.)?kick\.com\/([\w-]+\/videos|video)\/[\w-]+/i.test(u) ? 'kick' : null;
const platTag = u => { const p = plataforma(u); return p ? `<span class="plat ${p}">${PLATS[p]}</span>` : ''; };
const hms = s => { s = Math.floor(s || 0); return Math.floor(s / 3600) + ':' + String(Math.floor(s % 3600 / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
const mmss = s => { s = Math.round(s || 0); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const quando = d => new Date(d).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }).replace(',', ' ·');
const nomeLive = l => l ? (l.titulo || String(l.fonte || '').split(/[/=]/).pop() || 'Live') : 'Live';
const postado = c => c.tiktok || c.shorts || c.reels;
// os vídeos são apagados 7 dias depois de prontos; video_url continua preenchido, então olha expira_em também
const venceu = t => !!t && new Date(t) < new Date();
const expirou = c => !c.video_url || venceu(c.expira_em);
// o Supabase devolve no máximo 1000 linhas por consulta; isso busca página por página até acabar.
// mk() precisa montar a consulta de novo a cada chamada e ter uma ordem estável (ex.: terminar em .order('id')).
async function todasLinhas(mk, pag = 1000) {
  const out = [];
  for (;;) {
    const { data, error } = await mk().range(out.length, out.length + pag - 1);
    if (error) return { data: null, error };
    out.push(...data);
    if (!data.length) return { data: out, error: null };
  }
}
async function statusWorker() {
  const { data } = await VZ.sb.from('worker').select('visto_em').eq('id', 1).maybeSingle();
  const on = data && data.visto_em && (Date.now() - new Date(data.visto_em)) < 90000;
  $('#wk').classList.toggle('on', !!on);
  $('#wk span').textContent = on ? 'Online, pronto pra processar' : 'Offline';
  return on;
}
const PRONTO = VZ.exigirLogin().then(s => {
  const m = s.user.user_metadata || {}, n = String(m.nome || m.full_name || m.name || s.user.email);
  $('#quem').textContent = n.split(' ').slice(0, 2).join(' ');
  $('#mail').textContent = s.user.email || '';
  $('#av').textContent = n.trim().charAt(0).toUpperCase();
  statusWorker(); setInterval(statusWorker, 15000);
  return s;
});
</script>

<script>
const ID = new URLSearchParams(location.search).get('id');
const REDES = { tiktok: 'TikTok', shorts: 'Shorts', reels: 'Reels' };
let LIVE, CS = [], filtro = 'todos';
const porN = n => CS.find(c => c.n == n);

async function salvar(c, d) {
  Object.assign(c, d);
  const { error } = await VZ.sb.from('cortes').update(d).eq('id', c.id);
  if (error) toast(VZ.erroPt(error));
}
function filtrar() {
  document.querySelectorAll('.ct').forEach(el => {
    const c = porN(el.dataset.n), p = postado(c);
    el.hidden = !(filtro == 'todos' ? !c.descartado : filtro == 'pend' ? !p && !c.descartado : filtro == 'post' ? p : c.descartado);
  });
  $('#cnt').textContent = `· ${CS.filter(postado).length} de ${CS.length} postados`;
}
function mudarFiltro(f) {
  document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x.dataset.f === f)); filtro = f; filtrar();
}
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => mudarFiltro(b.dataset.f));
function card(c) {
  const exp = expirou(c);
  return `<article class="ct ${c.descartado ? 'descartado' : ''}" data-n="${c.n}" id="c${c.n}">
  <div class="vid">${exp ? '<div class="expirado">Vídeo expirou<br>(apagado depois de 7 dias)</div>' : `<video src="${esc(c.video_url)}" controls preload="metadata"></video>`}
  <div class="tags"><span class="tag">#${c.n} · ${hms(c.inicio)}</span>${c.marcador ? '<span class="tag warn">⭐ #corte</span>' : `<span class="tag">🔥 ${(c.nota || 0).toFixed(1)}</span>`}</div></div>
  <div class="body"><textarea rows="2" data-k="titulo" maxlength="300">${esc(c.titulo)}</textarea>
  ${exp ? '' : `<div class="inline"><button class="btn" style="flex:1" data-a="pub">Publicar</button><a class="btn sec" href="${esc(c.download_url)}" title="Baixar MP4" aria-label="Baixar MP4">${ICON_DL}</a></div>`}
  <div class="pubs" data-pubs></div>
  <div class="redes">${Object.entries(REDES).map(([r, l]) => `<button class="rd ${c[r] ? 'on' : ''}" data-r="${r}">${c[r] ? '✓ ' : ''}${l}</button>`).join('')}</div>
  <div class="minis"><button class="btn sec sm" data-a="copiar">Copiar título</button><button class="btn sec sm" data-a="desc">${c.descartado ? 'Restaurar' : 'Descartar'}</button></div>
  </div></article>`;
}
$('#grid').addEventListener('click', ev => {
  const b = ev.target.closest('button'); if (!b) return;
  const el = b.closest('.ct'), c = porN(el.dataset.n);
  if (b.dataset.r) {
    const v = !c[b.dataset.r]; salvar(c, { [b.dataset.r]: v });
    b.classList.toggle('on', v); b.textContent = (v ? '✓ ' : '') + REDES[b.dataset.r];
    if (v) toast('Marcado como postado no ' + REDES[b.dataset.r]);
  } else if (b.dataset.a == 'pub') abrirPub(c);
  else if (b.dataset.a == 'reenviar') reenviar(b.dataset.id);
  else if (b.dataset.a == 'copiar') { navigator.clipboard.writeText(el.querySelector('textarea').value); toast('Título copiado'); }
  else if (b.dataset.a == 'desc') { const v = !c.descartado; salvar(c, { descartado: v }); el.classList.toggle('descartado', v); b.textContent = v ? 'Restaurar' : 'Descartar'; }
  filtrar();
});
$('#grid').addEventListener('change', ev => {
  if (ev.target.dataset.k) { salvar(porN(ev.target.closest('.ct').dataset.n), { titulo: ev.target.value }); toast('Título salvo'); }
});

// ---------- publicação direta nas redes (o notebook envia; ver redes.py)
const PUB_REDES = { youtube: 'YouTube', tiktok: 'TikTok', instagram: 'Instagram' };
const MARCA = { youtube: 'shorts', tiktok: 'tiktok', instagram: 'reels' };
let CONS = [], PUBS = [], alvo = null;
const el = c => document.querySelector(`.ct[data-n="${c.n}"]`);

function abrirPub(c) {  // c = corte, ou null = vídeo longo
  alvo = c;
  const redes = c ? Object.keys(PUB_REDES) : ['youtube'];
  $('#pub-t').textContent = c ? `Publicar corte #${c.n}` : 'Publicar vídeo longo';
  $('#pub-redes').innerHTML = redes.map(r => {
    const con = CONS.find(x => x.plataforma === r);
    return con ? `<label class="tg pr"><input type="checkbox" value="${r}" checked><i></i><span class="plat ${r}">${PUB_REDES[r]}</span><small>${esc(con.conta_nome)}</small></label>`
               : `<span class="tg pr off"><span class="plat ${r}">${PUB_REDES[r]}</span><a href="/app/conexoes">Conectar</a></span>`;
  }).join('');
  const t = c ? (el(c).querySelector('textarea').value || c.titulo || '') : (LIVE.titulo || '');
  $('#pub-titulo').value = t.replace(/\s#\S+/g, '').trim().slice(0, 100);
  $('#pub-desc').value = t;
  $('#pub-ok').disabled = !redes.some(r => CONS.find(x => x.plataforma === r));
  $('#dlg-pub').showModal();
}
$('#f-pub').addEventListener('submit', async ev => {
  if (!ev.submitter || ev.submitter.value !== 'ok') return;
  const redes = [...document.querySelectorAll('#pub-redes input:checked')].map(i => i.value);
  if (!redes.length) { ev.preventDefault(); return toast('Escolha pelo menos uma rede'); }
  const base = { titulo: $('#pub-titulo').value.trim().slice(0, 100) || null, descricao: $('#pub-desc').value.trim() || null, privacidade: $('#pub-priv').value };
  const linhas = redes.map(r => ({ ...base, plataforma: r, ...(alvo ? { corte_id: alvo.id } : { live_id: ID }) }));
  const { error } = await VZ.sb.from('publicacoes').insert(linhas);
  if (error) return toast(VZ.erroPt(error));
  toast(redes.length > 1 ? 'Enviando pras redes...' : 'Enviando pro ' + PUB_REDES[redes[0]] + '...');
  carregarPubs();
});
async function reenviar(id) {
  const p = PUBS.find(x => x.id === id); if (!p) return;
  const { error } = await VZ.sb.from('publicacoes').insert({ plataforma: p.plataforma, corte_id: p.corte_id, live_id: p.live_id, titulo: p.titulo, descricao: p.descricao, privacidade: p.privacidade });
  if (error) return toast(VZ.erroPt(error));
  await VZ.sb.from('publicacoes').delete().eq('id', id);
  toast('Tentando de novo...'); carregarPubs();
}
function chips(lista) {
  const ult = {};  // só o pedido mais recente de cada rede
  lista.forEach(p => { if (!ult[p.plataforma] || p.criado_em > ult[p.plataforma].criado_em) ult[p.plataforma] = p; });
  return Object.values(ult).map(p => {
    const n = PUB_REDES[p.plataforma];
    if (p.status === 'publicado') return `<span class="pub ok" title="${esc(p.detalhe || '')}">${p.url ? `<a href="${esc(p.url)}" target="_blank" rel="noopener">✓ ${n} · ver post</a>` : `✓ ${n}${p.detalhe ? ' · nos rascunhos' : ''}`}</span>`;
    if (p.status === 'erro') return `<span class="pub err" title="${esc(p.erro || '')}">${n}: ${esc((p.erro || 'erro').slice(0, 70))} <button class="link-btn" data-a="reenviar" data-id="${p.id}">tentar de novo</button></span>`;
    return `<span class="pub on"><i></i>${n} · ${esc(p.status === 'fila' ? 'na fila' : p.detalhe || 'enviando')}</span>`;
  }).join('');
}
async function carregarPubs() {
  const ids = CS.map(c => c.id);
  const q = VZ.sb.from('publicacoes').select('*').order('criado_em');
  const { data, error } = await (ids.length ? q.or(`live_id.eq.${ID},corte_id.in.(${ids.join(',')})`) : q.eq('live_id', ID));
  if (error) return;
  const antes = Object.fromEntries(PUBS.map(p => [p.id, p.status]));
  PUBS = data;
  PUBS.forEach(p => {  // acabou de publicar: marca como postado na tela também
    if (p.status !== 'publicado' || !antes[p.id] || antes[p.id] === 'publicado') return;
    const c = CS.find(x => x.id === p.corte_id), m = MARCA[p.plataforma];
    if (c) { c[m] = true; const b = el(c)?.querySelector(`[data-r="${m}"]`); if (b) { b.classList.add('on'); b.textContent = '✓ ' + REDES[m]; } }
    else if (p.live_id) { LIVE.longo_postado = true; $('#yt-post').classList.add('on'); $('#yt-post').textContent = '✓ Postado no YouTube'; }
    toast('Publicado no ' + PUB_REDES[p.plataforma] + '!');
  });
  CS.forEach(c => { const box = el(c)?.querySelector('[data-pubs]'); if (box) box.innerHTML = chips(PUBS.filter(p => p.corte_id === c.id)); });
  $('#yt-pubs').innerHTML = chips(PUBS.filter(p => p.live_id === ID));
  filtrar();
}
$('#yt-pub').onclick = () => abrirPub(null);
$('#yt-pubs').addEventListener('click', ev => { const b = ev.target.closest('[data-a="reenviar"]'); if (b) reenviar(b.dataset.id); });

PRONTO.then(async () => {
  if (!ID) return location.replace('/app');
  const [l, c] = await Promise.all([
    VZ.sb.from('lives').select('*').eq('id', ID).maybeSingle(),
    VZ.sb.from('cortes').select('*').eq('live_id', ID).order('n'),
  ]);
  if (l.error || c.error) return toast(VZ.erroPt(l.error || c.error));
  if (!l.data) { $('#titulo').textContent = 'Live não encontrada'; return; }
  LIVE = l.data; CS = c.data;
  document.title = (LIVE.titulo || 'Live') + ' · Viraliza';
  $('#titulo').textContent = LIVE.titulo || 'Live ' + nomeLive(LIVE);
  $('#sub').textContent = [LIVE.canal, new Date(LIVE.criado_em).toLocaleString('pt-BR'), CS.length + ' cortes'].filter(Boolean).join(' · ');
  if (LIVE.longo_url && !venceu(LIVE.expira_em)) {
    $('#yt').hidden = false; $('#ytv').src = LIVE.longo_url;
    $('#yt-dl').href = LIVE.longo_download_url; $('#yt-dl').innerHTML = ICON_DL + ' Baixar MP4';
    const yb = $('#yt-post'), sy = () => { yb.classList.toggle('on', LIVE.longo_postado); yb.textContent = LIVE.longo_postado ? '✓ Postado no YouTube' : 'Marcar como postado'; };
    sy();
    yb.onclick = async () => {
      LIVE.longo_postado = !LIVE.longo_postado; sy();
      const { error } = await VZ.sb.from('lives').update({ longo_postado: LIVE.longo_postado }).eq('id', ID);
      if (error) toast(VZ.erroPt(error));
    };
  }
  if (LIVE.expira_em) $('#aviso').textContent = 'Os vídeos ficam disponíveis até ' + new Date(LIVE.expira_em).toLocaleString('pt-BR') + '. Baixe antes disso.';
  $('#grid').innerHTML = CS.map(card).join(''); filtrar();
  const alvoN = location.hash.match(/^#c(\d+)$/), alvoEl = alvoN && $('#c' + alvoN[1]);
  // corte descartado não aparece em "Todos": abre a aba onde ele está, em vez de forçar ele visível
  if (alvoEl && alvoEl.hidden) mudarFiltro(porN(alvoN[1]).descartado ? 'desc' : 'todos');
  if (alvoEl) { alvoEl.scrollIntoView({ block: 'center' }); alvoEl.classList.add('foco'); }
  const con = await VZ.sb.from('conexoes').select('plataforma,conta_nome');
  CONS = con.data || [];
  carregarPubs();
  setInterval(() => { if (PUBS.some(p => ['fila', 'enviando'].includes(p.status))) carregarPubs(); }, 4000);
});
</script>
